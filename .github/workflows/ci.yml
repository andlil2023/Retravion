name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: retravion-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RETRAVION_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=retravion-ci-only
    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Retravion.slnx
      - name: Build
        run: dotnet build Retravion.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Retravion.slnx --configuration Release --no-build --no-restore
